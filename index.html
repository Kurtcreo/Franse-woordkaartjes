<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oefen Franse woorden</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #eff6ff;
      color: #12335f;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .app {
      width: 100%;
      max-width: 820px;
      background: white;
      border: 1px solid #dbeafe;
      border-radius: 24px;
      box-shadow: 0 20px 45px rgba(15, 23, 42, 0.14);
      padding: 32px;
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      color: #1e3a8a;
      font-size: 32px;
    }

    p {
      color: #1d4ed8;
      line-height: 1.5;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-top: 24px;
    }

    button {
      border: none;
      cursor: pointer;
      font-family: inherit;
    }

    button:disabled {
      cursor: default;
      opacity: 0.65;
    }

    .btn {
      border-radius: 14px;
      padding: 14px 22px;
      font-weight: 700;
      font-size: 16px;
      transition: 0.2s;
    }

    .btn-blue {
      background: #1d4ed8;
      color: white;
      box-shadow: 0 8px 18px rgba(29, 78, 216, 0.25);
    }

    .btn-blue:hover {
      background: #1e40af;
    }

    .btn-yellow {
      background: #facc15;
      color: #172554;
      box-shadow: 0 8px 18px rgba(250, 204, 21, 0.25);
    }

    .btn-yellow:hover {
      background: #fde047;
    }

    .btn-outline {
      background: white;
      color: #1e3a8a;
      border: 1px solid #bfdbfe;
    }

    .btn-outline:hover {
      background: #eff6ff;
      border-color: #60a5fa;
    }

    .button-row {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 22px;
    }

    .theme-button {
      border-radius: 16px;
      border: 1px solid #bfdbfe;
      background: white;
      color: #172554;
      font-weight: 700;
      padding: 18px;
      box-shadow: 0 4px 10px rgba(15, 23, 42, 0.06);
      transition: 0.2s;
    }

    .theme-button:hover {
      background: #eff6ff;
      border-color: #60a5fa;
      transform: translateY(-1px);
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      color: #1d4ed8;
      font-size: 14px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .link-button {
      background: transparent;
      color: #1d4ed8;
      text-decoration: underline;
      font-size: 14px;
      padding: 0;
    }

    .progress {
      width: 100%;
      height: 16px;
      background: #dbeafe;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .progress-fill {
      height: 100%;
      background: #facc15;
      transition: width 0.3s;
    }

    .card-wrap {
      perspective: 1000px;
      height: 230px;
      width: 100%;
      margin: 0 auto;
      cursor: pointer;
    }

    .card {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.5s;
      border-radius: 22px;
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.14);
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      border-radius: 22px;
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card-front {
      background: white;
      border: 2px solid #bfdbfe;
    }

    .card-back {
      background: #1d4ed8;
      color: white;
      transform: rotateY(180deg);
    }

    .label {
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 13px;
      color: #3b82f6;
      margin-bottom: 10px;
    }

    .card-back .label {
      color: #fde047;
    }

    .word {
      font-size: 34px;
      font-weight: 800;
      color: #172554;
      text-align: center;
    }

    .card-back .word {
      color: white;
    }

    .hint {
      margin-top: 18px;
      color: #3b82f6;
      font-size: 14px;
    }

    .card-back .hint {
      color: #dbeafe;
    }

    .listen-btn {
      margin-top: 18px;
      border-radius: 12px;
      background: #facc15;
      color: #172554;
      padding: 10px 16px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .question-box {
      border: 2px solid #bfdbfe;
      border-radius: 22px;
      padding: 28px;
      margin-bottom: 22px;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.06);
    }

    .answers {
      display: grid;
      gap: 12px;
      text-align: left;
    }

    .answer {
      border: 2px solid #bfdbfe;
      border-radius: 16px;
      background: white;
      color: #172554;
      padding: 16px;
      transition: 0.2s;
    }

    .answer:hover {
      background: #eff6ff;
      border-color: #60a5fa;
    }

    .answer.good {
      background: #dcfce7;
      border-color: #22c55e;
      color: #14532d;
    }

    .answer.bad {
      background: #fee2e2;
      border-color: #ef4444;
      color: #7f1d1d;
    }

    .answer-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .answer-choice {
      flex: 1;
      background: transparent;
      color: inherit;
      font-weight: 800;
      text-align: left;
      font-size: 16px;
    }

    .feedback {
      margin-top: 22px;
      padding: 16px;
      border-radius: 16px;
      font-weight: 700;
    }

    .feedback.good {
      background: #dcfce7;
      color: #14532d;
    }

    .feedback.bad {
      background: #fee2e2;
      color: #7f1d1d;
    }

    .score-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-top: 24px;
      flex-wrap: wrap;
    }

    .score-badge {
      width: 92px;
      height: 92px;
      border-radius: 50%;
      background: #facc15;
      color: #172554;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: 900;
      margin-bottom: 18px;
    }

    @media (max-width: 600px) {
      .app {
        padding: 22px;
      }

      h1 {
        font-size: 26px;
      }

      .word {
        font-size: 28px;
      }

      .score-row {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>Oefen Franse woorden</h1>
    <div id="app-content"></div>
  </main>

  <script>
    const themaWoorden = {
      Basis: [
        { fr: "Bonjour", nl: "Hallo / Goedendag" },
        { fr: "Au revoir", nl: "Tot ziens" },
        { fr: "Merci", nl: "Dank je" },
        { fr: "Oui", nl: "Ja" },
        { fr: "Non", nl: "Nee" },
        { fr: "S’il vous plaît", nl: "Alstublieft" },
        { fr: "Pardon", nl: "Sorry" },
        { fr: "Excusez-moi", nl: "Neem me niet kwalijk" },
        { fr: "Comment ça va?", nl: "Hoe gaat het?" },
        { fr: "Ça va bien", nl: "Het gaat goed" }
      ],
      Voornaamwoorden: [
        { fr: "Je", nl: "Ik" },
        { fr: "Tu", nl: "Jij" },
        { fr: "Il", nl: "Hij" },
        { fr: "Elle", nl: "Zij" },
        { fr: "Nous", nl: "Wij" },
        { fr: "Vous", nl: "U / Jullie" },
        { fr: "Ils", nl: "Zij (mannelijk meervoud)" },
        { fr: "Elles", nl: "Zij (vrouwelijk meervoud)" }
      ],
      Cijfers: [
        { fr: "Un", nl: "Een" },
        { fr: "Deux", nl: "Twee" },
        { fr: "Trois", nl: "Drie" },
        { fr: "Quatre", nl: "Vier" },
        { fr: "Cinq", nl: "Vijf" },
        { fr: "Six", nl: "Zes" },
        { fr: "Sept", nl: "Zeven" },
        { fr: "Huit", nl: "Acht" },
        { fr: "Neuf", nl: "Negen" },
        { fr: "Dix", nl: "Tien" }
      ],
      Familie: [
        { fr: "La famille", nl: "De familie" },
        { fr: "Le père", nl: "De vader" },
        { fr: "La mère", nl: "De moeder" },
        { fr: "Le frère", nl: "De broer" },
        { fr: "La sœur", nl: "De zus" },
        { fr: "Le fils", nl: "De zoon" },
        { fr: "La fille", nl: "De dochter" },
        { fr: "Les parents", nl: "De ouders" },
        { fr: "Le mari", nl: "De echtgenoot" },
        { fr: "La femme", nl: "De echtgenote" }
      ],
      Dagen: [
        { fr: "Lundi", nl: "Maandag" },
        { fr: "Mardi", nl: "Dinsdag" },
        { fr: "Mercredi", nl: "Woensdag" },
        { fr: "Jeudi", nl: "Donderdag" },
        { fr: "Vendredi", nl: "Vrijdag" },
        { fr: "Samedi", nl: "Zaterdag" },
        { fr: "Dimanche", nl: "Zondag" }
      ],
      Eten_en_drinken: [
        { fr: "Le pain", nl: "Het brood" },
        { fr: "Le fromage", nl: "De kaas" },
        { fr: "Le lait", nl: "De melk" },
        { fr: "Le café", nl: "De koffie" },
        { fr: "Le thé", nl: "De thee" },
        { fr: "L’eau", nl: "Het water" },
        { fr: "Le vin", nl: "De wijn" },
        { fr: "Le poulet", nl: "De kip" },
        { fr: "Le poisson", nl: "De vis" },
        { fr: "Les légumes", nl: "De groenten" }
      ],
      Restaurant: [
        { fr: "Je voudrais…", nl: "Ik zou graag… willen" },
        { fr: "L’addition, s’il vous plaît", nl: "De rekening, alstublieft" },
        { fr: "Le menu, s’il vous plaît", nl: "Het menu, alstublieft" },
        { fr: "Quelle est la spécialité de la maison?", nl: "Wat is de specialiteit van het huis?" },
        { fr: "Je suis végétarien(ne)", nl: "Ik ben vegetariër" }
      ],
      Vervoer_en_route: [
        { fr: "La voiture", nl: "De auto" },
        { fr: "Le bus", nl: "De bus" },
        { fr: "Le train", nl: "De trein" },
        { fr: "L’avion", nl: "Het vliegtuig" },
        { fr: "Le bateau", nl: "De boot" },
        { fr: "La gare", nl: "Het station" },
        { fr: "L’aéroport", nl: "Het vliegveld" },
        { fr: "Le taxi", nl: "De taxi" },
        { fr: "La rue", nl: "De straat" },
        { fr: "Le chemin", nl: "De weg" },
        { fr: "Où est…?", nl: "Waar is…?" },
        { fr: "Comment puis-je aller à…?", nl: "Hoe kom ik bij…?" },
        { fr: "C’est loin?", nl: "Is het ver?" },
        { fr: "Tournez à gauche", nl: "Sla linksaf" },
        { fr: "Tournez à droite", nl: "Sla rechtsaf" },
        { fr: "Allez tout droit", nl: "Ga rechtdoor" }
      ]
    };

    const themaLabels = {
      Basis: "Basis",
      Voornaamwoorden: "Voornaamwoorden",
      Cijfers: "Cijfers",
      Familie: "Familie",
      Dagen: "Dagen",
      Eten_en_drinken: "Eten en drinken",
      Restaurant: "Restaurant",
      Vervoer_en_route: "Vervoer en route"
    };

    let gekozenThema = null;
    let modus = null;
    let woorden = [];
    let index = 0;
    let gekozenAntwoord = null;
    let toonFeedback = false;
    let score = 0;
    let testKlaar = false;
    let kaartOmgedraaid = false;

    const app = document.getElementById("app-content");

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function spreekFrans(tekst) {
      if (!("speechSynthesis" in window)) return;

      window.speechSynthesis.cancel();
      const bericht = new SpeechSynthesisUtterance(tekst);
      bericht.lang = "fr-FR";
      bericht.rate = 0.9;
      window.speechSynthesis.speak(bericht);
    }

    function huidigeWoorden() {
      if (modus === "test") return woorden.slice(0, Math.min(10, woorden.length));
      return woorden;
    }

    function totaalVragen() {
      return modus === "test" ? Math.min(10, woorden.length) : woorden.length;
    }

    function render() {
      if (!gekozenThema) {
        renderThemaKeuze();
        return;
      }

      if (!modus) {
        renderModusKeuze();
        return;
      }

      if (modus === "test" && testKlaar) {
        renderEindscherm();
        return;
      }

      renderOefenenOfTest();
    }

    function renderThemaKeuze() {
      const themaNamen = Object.keys(themaWoorden);
      app.innerHTML = `
        <p>Kies eerst een thema.</p>
        <div class="grid">
          ${themaNamen.map(thema => `
            <button class="theme-button" onclick="kiesThema('${thema}')">
              ${themaLabels[thema]}
            </button>
          `).join("")}
        </div>
      `;
    }

    function renderModusKeuze() {
      app.innerHTML = `
        <p>Gekozen thema: <strong>${themaLabels[gekozenThema]}</strong></p>
        <p>Wat wil je doen?</p>
        <div class="button-row">
          <button class="btn btn-blue" onclick="startFlashcards()">Oefenen</button>
          <button class="btn btn-yellow" onclick="startTest()">Test</button>
        </div>
        <button class="link-button" style="margin-top:18px" onclick="terugNaarStart()">Kies een ander thema</button>
      `;
    }

    function renderOefenenOfTest() {
      const lijst = huidigeWoorden();
      const huidig = lijst[index];
      const progress = Math.round(((index + 1) / lijst.length) * 100);

      app.innerHTML = `
        <div class="topbar">
          <span>Thema: ${themaLabels[gekozenThema]}</span>
          <button class="link-button" onclick="terugNaarStart()">Terug naar start</button>
        </div>

        <div class="progress">
          <div class="progress-fill" style="width:${progress}%"></div>
        </div>

        <p>${modus === "flashcards" ? `Woord ${index + 1} van ${lijst.length}` : `Vraag ${index + 1} van ${totaalVragen()}`}</p>

        ${modus === "flashcards" ? renderFlashcard(huidig) : renderTestvraag(huidig)}
      `;
    }

    function renderFlashcard(woord) {
      return `
        <div class="card-wrap" onclick="draaiKaart()">
          <div class="card ${kaartOmgedraaid ? "flipped" : ""}">
            <div class="card-face card-front">
              <div class="label">Nederlands</div>
              <div class="word">${woord.nl}</div>
              <div class="hint">Klik om om te draaien</div>
            </div>
            <div class="card-face card-back">
              <div class="label">Frans</div>
              <div class="word">${woord.fr}</div>
              <button class="listen-btn" onclick="event.stopPropagation(); spreekFrans('${escapeQuote(woord.fr)}')">🔊 Luister</button>
              <div class="hint">Klik om terug te draaien</div>
            </div>
          </div>
        </div>
        <button class="btn btn-blue" style="margin-top:28px" onclick="volgendWoord()">Volgend woord</button>
      `;
    }

    function renderTestvraag(huidig) {
      const opties = maakAntwoordOpties(huidig);

      return `
        <div class="question-box">
          <div class="label">Nederlands</div>
          <div class="word">${huidig.nl}</div>
          <p>Luister naar de opties en kies het juiste Franse woord.</p>
        </div>

        <div class="answers">
          ${opties.map((optie, i) => {
            const isGoed = optie === huidig.fr;
            const isGekozen = gekozenAntwoord === optie;
            let cls = "answer";
            if (toonFeedback && isGoed) cls += " good";
            else if (toonFeedback && isGekozen && !isGoed) cls += " bad";

            return `
              <div class="${cls}">
                <div class="answer-inner">
                  <button class="answer-choice" ${toonFeedback ? "disabled" : ""} onclick="kiesAntwoord('${escapeQuote(optie)}')">
                    Optie ${i + 1}
                  </button>
                  <button class="listen-btn" style="margin-top:0" onclick="spreekFrans('${escapeQuote(optie)}')">🔊 Luister</button>
                </div>
              </div>
            `;
          }).join("")}
        </div>

        ${toonFeedback ? `
          <div class="feedback ${gekozenAntwoord === huidig.fr ? "good" : "bad"}">
            ${gekozenAntwoord === huidig.fr ? "Correct! Goed gedaan." : `Niet juist. Het goede antwoord is: ${huidig.fr}`}
          </div>
        ` : ""}

        <div class="score-row">
          <strong>Score: ${score}</strong>
          <button class="btn btn-blue" ${toonFeedback ? "" : "disabled"} onclick="volgendWoord()">
            ${index + 1 >= totaalVragen() ? "Bekijk score" : "Volgende vraag"}
          </button>
        </div>
      `;
    }

    function renderEindscherm() {
      const totaal = totaalVragen();
      const percentage = totaal > 0 ? Math.round((score / totaal) * 100) : 0;

      app.innerHTML = `
        <div class="score-badge">${percentage}%</div>
        <h2>Test afgerond</h2>
        <p>Thema: <strong>${themaLabels[gekozenThema]}</strong></p>
        <p>Je score is <strong>${score} op ${totaal}</strong>.</p>
        <div class="button-row">
          <button class="btn btn-blue" onclick="startTest()">Opnieuw testen</button>
          <button class="btn btn-yellow" onclick="startFlashcards()">Eerst oefenen</button>
          <button class="btn btn-outline" onclick="terugNaarStart()">Ander thema</button>
        </div>
      `;
    }

    function maakAntwoordOpties(huidig) {
      const fouteOpties = woorden
        .filter(woord => woord.fr !== huidig.fr)
        .map(woord => woord.fr);

      const gekozenFouten = shuffle(fouteOpties).slice(0, 2);
      return shuffle([huidig.fr, ...gekozenFouten]);
    }

    function kiesThema(thema) {
      gekozenThema = thema;
      modus = null;
      woorden = shuffle(themaWoorden[thema]);
      index = 0;
      gekozenAntwoord = null;
      toonFeedback = false;
      score = 0;
      testKlaar = false;
      kaartOmgedraaid = false;
      render();
    }

    function startFlashcards() {
      modus = "flashcards";
      woorden = shuffle(themaWoorden[gekozenThema]);
      index = 0;
      gekozenAntwoord = null;
      toonFeedback = false;
      score = 0;
      testKlaar = false;
      kaartOmgedraaid = false;
      render();
    }

    function startTest() {
      modus = "test";
      woorden = shuffle(themaWoorden[gekozenThema]);
      index = 0;
      gekozenAntwoord = null;
      toonFeedback = false;
      score = 0;
      testKlaar = false;
      kaartOmgedraaid = false;
      render();
    }

    function terugNaarStart() {
      gekozenThema = null;
      modus = null;
      woorden = [];
      index = 0;
      gekozenAntwoord = null;
      toonFeedback = false;
      score = 0;
      testKlaar = false;
      kaartOmgedraaid = false;
      render();
    }

    function draaiKaart() {
      kaartOmgedraaid = !kaartOmgedraaid;
      render();
    }

    function volgendWoord() {
      const lijst = huidigeWoorden();
      const volgendeIndex = index + 1;

      if (modus === "test" && volgendeIndex >= totaalVragen()) {
        testKlaar = true;
        gekozenAntwoord = null;
        toonFeedback = false;
        render();
        return;
      }

      index = volgendeIndex % lijst.length;
      gekozenAntwoord = null;
      toonFeedback = false;
      kaartOmgedraaid = false;
      render();
    }

    function kiesAntwoord(antwoord) {
      if (toonFeedback) return;

      const huidig = huidigeWoorden()[index];
      gekozenAntwoord = antwoord;
      toonFeedback = true;

      if (antwoord === huidig.fr) {
        score++;
      }

      render();
    }

    function escapeQuote(text) {
      return String(text)
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'")
        .replace(/"/g, "&quot;");
    }

    render();
  </script>
</body>
</html>
